name: Bug Report
description: Report a problem with gas-sheets-query
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug report!
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps or code to reproduce the behavior.
      placeholder: |
        1. Define schema '...'
        2. Run query '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where does the issue occur?
      options:
        - Google Apps Script (GAS)
        - Node.js (local)
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package Version
      description: Which version of "@gsquery/*" are you using?
      placeholder: "0.9.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Any relevant error output (will be formatted as code).
      render: shell
