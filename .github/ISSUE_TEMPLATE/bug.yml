name: Bug
description: Something is broken
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps or code to reproduce the behavior.
      placeholder: |
        1. Define schema '...'
        2. Run query '...'
        3. See error
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where does the issue occur?
      options:
        - Google Apps Script (GAS)
        - Node.js (local)
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package Version
      description: Which version of "@gsquery/*" are you using?
      placeholder: "0.9.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Any relevant error output (will be formatted as code).
      render: shell
  - type: dropdown
    id: source
    attributes:
      label: How was this opened?
      options:
        - I need this myself
        - On someone else's behalf
        - While working on the code
    validations:
      required: true
